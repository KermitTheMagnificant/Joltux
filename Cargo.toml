[package]
name = "joltux"
version = "0.1.0"
edition = "2021"
description = "Unofficial Game Jolt launcher for Linux: downloads games and runs Windows builds through Proton/Wine"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
flate2 = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[[bin]]
name = "joltux"
path = "main.rs"
